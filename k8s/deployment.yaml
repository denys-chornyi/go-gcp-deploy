apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
spec:
  replicas: ${NUM_REPLICAS}
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      containers:
        - name: ${APP_NAME}
          image: ${IMAGE_TAG}
          ports:
            - containerPort: ${PORT}
          env:
            - name: PORT
              value: "${PORT}"
            - name: APP_NAME
              value: "${APP_NAME}"
            - name: ENVIRONMENT
              value: "${ENVIRONMENT}"
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}-service
spec:
  type: LoadBalancer
  selector:
    app: ${APP_NAME}      # Must match deployment template labels
  ports:
    - port: 80
      targetPort: ${PORT}
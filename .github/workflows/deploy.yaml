name: Build and Deploy to GKE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Verify Dependencies
        run: |
          go mod download
          go mod verify

      - name: Compile Application (main.go)
        run: |
          # Fails immediately if syntax or type errors exist
          go build -v -o /dev/null ./...

      - name: Execute Tests
        run: |
            set -a
            source k8s/k8s.env
            set +a
            go test -race -v ./...

  deploy:
    name: Deploy to GKE
    needs: ci-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Load env
      - name: Load Environment File
        run: |
            grep -v '^#' .github/ci.env >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider'
          service_account: 'github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Deploy to Kubernetes
        run: |
          set -a
          source k8s/k8s.env
          set +a
          
          # 2. Export IMAGE_TAG explicitly so envsubst can see it
          export IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          # 3. Substitute variables and apply directly
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          envsubst < k8s/hpa.yaml | kubectl apply -f -
          
          # 4. Wait for the rollout to finish
          kubectl rollout status deployment/${APP_NAME} --timeout=120s